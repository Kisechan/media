<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>拾光 · 内容解析</title>
    <meta name="description" content="解析公开的小红书、知乎与 X 内容，预览正文与媒体资源。" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar"><a class="brand" href="/" aria-label="拾光首页"><span class="brand-mark">✳</span><span>拾光</span></a><span class="top-note">为公开内容留一份清晰备份</span></header>
      <main>
        <section class="hero"><div class="eyebrow">MEDIA ARCHIVE · 01</div><h1>收藏灵感，<br /><em>保留原貌。</em></h1><p>粘贴公开内容链接，查看正文、图片与视频。支持小红书、知乎和 X。</p></section>
        <section class="workspace" aria-label="内容解析"><form id="parse-form"><label for="link">内容链接</label><div class="input-row"><input id="link" name="link" type="url" placeholder="粘贴小红书、知乎或 X 链接" autocomplete="off" required /><button id="submit" type="submit">开始解析 <span aria-hidden="true">↗</span></button></div><div class="form-footer"><div class="platforms"><span>支持平台</span><strong>小红书</strong><strong>知乎</strong><strong>X / Twitter</strong></div><span id="detected">自动识别</span></div><div id="turnstile" class="turnstile"></div></form><div id="status" class="status" role="status" aria-live="polite"></div><div id="result" class="result"></div></section>
        <section class="guide"><div class="guide-heading"><span class="eyebrow">HOW IT WORKS</span><h2>三步，存下值得回看的内容。</h2></div><div class="steps"><div><span>01</span><h3>复制链接</h3><p>从公开帖子或文章复制分享地址。</p></div><div><span>02</span><h3>查看内容</h3><p>确认标题、作者、正文和媒体资源。</p></div><div><span>03</span><h3>保存资源</h3><p>选择图片原图或视频清晰度下载。</p></div></div></section>
      </main>
      <footer><span>拾光 / MEDIA ARCHIVE</span><span>请尊重创作者版权与平台规则</span></footer>
    </div>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
